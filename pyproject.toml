[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-image-steganography"
version = "0.1.0"
description = "Payload embedding in image-space 2D Gaussian parameters"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
  {name = "Tong Wu"},
  {name = "Runze Cheng"},
  {name = "Xiaoyue Fan"},
  {name = "Kaan Akşit"},
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = ["torch>=2.0", "torchvision>=0.15", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "Pillow>=9.5", "scikit-image>=0.20", "scikit-learn>=1.2", "geomloss>=0.2.6", "lpips>=0.1.4", "scienceplots>=2.1"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
gaussian-steg = "gaussian_steganography.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/gaussian_steganography"]
addopts = "-ra"
